<svg width="100%" height="100%" viewBox="0 0 1120 920" fill="none" xmlns="http://www.w3.org/2000/svg"
  shape-rendering="geometricPrecision" text-rendering="geometricPrecision" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1120" y2="920" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#0B1020"/>
<stop offset="100%" stop-color="#11192B"/>
</linearGradient>
<linearGradient id="accent" x1="120" y1="80" x2="1000" y2="560" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#5D688A"/>
<stop offset="45%" stop-color="#F7A5A5"/>
<stop offset="100%" stop-color="#FFDBB6"/>
</linearGradient>
<linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#121A2B"/>
<stop offset="100%" stop-color="#0C1220"/>
</linearGradient>
<style>
      .title { font: 800 54px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cardTitle { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
</defs>
<rect width="1120" height="920" fill="url(#bg)"/>
<rect x="20" y="20" width="1080" height="880" rx="28"
fill="url(#cardFill)" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Row 1 Left: Chronos -->
<rect x="48" y="48" width="490" height="240" rx="22"
fill="#0E1525" stroke="#5D688A" stroke-opacity="0.55" stroke-width="1.2"/>
<rect x="48" y="48" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.85"/>
<text x="74" y="105" class="cardTitle" fill="#FFF2EF">🧠 Chronos</text>
<text x="74" y="136" class="body" fill="#FFF2EF" opacity="0.92">AI Chief of Staff platform integrating Gmail,</text>
<text x="74" y="158" class="body" fill="#FFF2EF" opacity="0.92">Google Calendar and Gemini to generate</text>
<text x="74" y="180" class="body" fill="#FFF2EF" opacity="0.92">personalized schedules, task prioritization</text>
<rect x="74" y="205" rx="10" width="78" height="26" fill="#5D688A" opacity="0.95"/>
<rect x="160" y="205" rx="10" width="72" height="26" fill="#F7A5A5" opacity="0.95"/>
<rect x="240" y="205" rx="10" width="66" height="26" fill="#FFDBB6" opacity="0.98"/>
<text x="113" y="222" text-anchor="middle" class="pill" fill="#FFF2EF">FastAPI</text>
<text x="196" y="222" text-anchor="middle" class="pill" fill="#0B1020">Gemini</text>
<text x="273" y="222" text-anchor="middle" class="pill" fill="#0B1020">React</text>

<!-- Row 1 Right: Referra -->
<rect x="582" y="48" width="490" height="240" rx="22"
fill="#0E1525" stroke="#F7A5A5" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="582" y="48" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
<text x="608" y="105" class="cardTitle" fill="#FFF2EF">📚 Referra</text>
<text x="608" y="136" class="body" fill="#FFF2EF" opacity="0.92">Hybrid RAG citation assistant with a</text>
<text x="608" y="158" class="body" fill="#FFF2EF" opacity="0.92">9-step NLP pipeline, semantic retrieval,</text>
<text x="608" y="180" class="body" fill="#FFF2EF" opacity="0.92">OpenAlex fallback and multi-stage review.</text>
<rect x="608" y="205" rx="10" width="78" height="26" fill="#5D688A" opacity="0.95"/>
<rect x="694" y="205" rx="10" width="66" height="26" fill="#F7A5A5" opacity="0.95"/>
<rect x="768" y="205" rx="10" width="66" height="26" fill="#FFDBB6" opacity="0.98"/>
<text x="647" y="222" text-anchor="middle" class="pill" fill="#FFF2EF">FastAPI</text>
<text x="727" y="222" text-anchor="middle" class="pill" fill="#0B1020">FAISS</text>
<text x="801" y="222" text-anchor="middle" class="pill" fill="#0B1020">React</text>

<!-- Row 2 Left: IntelliSched -->
