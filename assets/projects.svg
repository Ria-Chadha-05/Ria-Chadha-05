<text x="74" y="377" class="cardTitle" fill="#FFF2EF">📅 IntelliSched</text>
<text x="74" y="408" class="body" fill="#FFF2EF" opacity="0.92">Dual-LLM timetable generator with</text>
<text x="74" y="430" class="body" fill="#FFF2EF" opacity="0.92">constraint satisfaction, admin chatbot</text>
<text x="74" y="452" class="body" fill="#FFF2EF" opacity="0.92">and weather automation via Vercel Cron.</text>
<rect x="74" y="477" rx="10" width="66" height="26" fill="#5D688A" opacity="0.95"/>
<rect x="148" y="477" rx="10" width="66" height="26" fill="#F7A5A5" opacity="0.95"/>
<rect x="222" y="477" rx="10" width="66" height="26" fill="#FFDBB6" opacity="0.98"/>
<text x="107" y="494" text-anchor="middle" class="pill" fill="#FFF2EF">React</text>
<text x="181" y="494" text-anchor="middle" class="pill" fill="#0B1020">Groq</text>
<text x="255" y="494" text-anchor="middle" class="pill" fill="#0B1020">Node.js</text>

<!-- Row 2 Right: Vaishali Electronics -->
<rect x="582" y="320" width="490" height="240" rx="22"
fill="#0E1525" stroke="#F7A5A5" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="582" y="320" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
<text x="608" y="377" class="cardTitle" fill="#FFF2EF">🛒 Vaishali Electronics</text>
<text x="608" y="408" class="body" fill="#FFF2EF" opacity="0.92">AI-powered retail platform built through</text>
<text x="608" y="430" class="body" fill="#FFF2EF" opacity="0.92">product discovery, customer funnel analysis,</text>
<text x="608" y="452" class="body" fill="#FFF2EF" opacity="0.92">UX strategy and AI shopping assistant design.</text>
<rect x="608" y="477" rx="10" width="66" height="26" fill="#5D688A" opacity="0.95"/>
<rect x="682" y="477" rx="10" width="66" height="26" fill="#F7A5A5" opacity="0.95"/>
<rect x="756" y="477" rx="10" width="78" height="26" fill="#FFDBB6" opacity="0.98"/>
<text x="641" y="494" text-anchor="middle" class="pill" fill="#FFF2EF">React</text>
<text x="715" y="494" text-anchor="middle" class="pill" fill="#0B1020">Figma</text>
<text x="795" y="494" text-anchor="middle" class="pill" fill="#0B1020">Product</text>

<!-- Row 3 Left: Ayuh Bot Audit -->
<rect x="48" y="592" width="490" height="240" rx="22"
fill="#0E1525" stroke="#5D688A" stroke-opacity="0.55" stroke-width="1.2"/>
<rect x="48" y="592" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
<text x="74" y="649" class="cardTitle" fill="#FFF2EF">🤖 Ayuh Bot Audit</text>
<text x="74" y="680" class="body" fill="#FFF2EF" opacity="0.92">Analyzed 7,593 production chatbot sessions,</text>
<text x="74" y="702" class="body" fill="#FFF2EF" opacity="0.92">identified failure patterns and built</text>
<text x="74" y="724" class="body" fill="#FFF2EF" opacity="0.92">interactive analytics dashboards.</text>
<rect x="74" y="749" rx="10" width="74" height="26" fill="#F7A5A5" opacity="0.95"/>
<rect x="156" y="749" rx="10" width="98" height="26" fill="#FFDBB6" opacity="0.98"/>
<rect x="262" y="749" rx="10" width="64" height="26" fill="#5D688A" opacity="0.95"/>
<text x="111" y="766" text-anchor="middle" class="pill" fill="#0B1020">Langfuse</text>
<text x="205" y="766" text-anchor="middle" class="pill" fill="#0B1020">JavaScript</text>
<text x="294" y="766" text-anchor="middle" class="pill" fill="#FFF2EF">Excel</text>

<!-- Row 3 Right: Healthcare Data Analysis -->
<rect x="582" y="592" width="490" height="240" rx="22"
fill="#0E1525" stroke="#F7A5A5" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="582" y="592" width="490" height="10" rx="5" fill="url(#accent)" opacity="0.8"/>
<text x="608" y="649" class="cardTitle" fill="#FFF2EF">🏥 Healthcare Data Analysis</text>
<text x="608" y="680" class="body" fill="#FFF2EF" opacity="0.92">Built an end-to-end healthcare analytics</text>
<text x="608" y="702" class="body" fill="#FFF2EF" opacity="0.92">pipeline with Dockerized PostgreSQL,</text>
<text x="608" y="724" class="body" fill="#FFF2EF" opacity="0.92">SQLAlchemy and interactive dashboards.</text>
<rect x="608" y="749" rx="10" width="90" height="26" fill="#5D688A" opacity="0.95"/>
<rect x="706" y="749" rx="10" width="72" height="26" fill="#F7A5A5" opacity="0.95"/>
<rect x="786" y="749" rx="10" width="94" height="26" fill="#FFDBB6" opacity="0.98"/>
<text x="653" y="766" text-anchor="middle" class="pill" fill="#FFF2EF">PostgreSQL</text>
<text x="742" y="766" text-anchor="middle" class="pill" fill="#0B1020">Docker</text>
<text x="833" y="766" text-anchor="middle" class="pill" fill="#0B1020">SQLAlchemy</text>

