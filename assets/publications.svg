<svg width="100%" height="100%" viewBox="0 0 1400 500" fill="none"
xmlns="http://www.w3.org/2000/svg"
shape-rendering="geometricPrecision"
text-rendering="geometricPrecision">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#11192B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1400" y2="520">
      <stop offset="0%" stop-color="#5D688A"/>
      <stop offset="50%" stop-color="#F7A5A5"/>
      <stop offset="100%" stop-color="#FFDBB6"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121A2B"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>

    <style>
      .title {
        font: 800 34px Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .cardTitle {
        font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .body {
        font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .pill {
        font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .fadeIn {
        opacity: 0;
        animation: fadeInUp 0.8s ease forwards;
      }

      .d1 { animation-delay: 0.15s; }
      .d2 { animation-delay: 0.35s; }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

  </defs>

  <!-- Background -->

  <rect width="1400" height="500" fill="url(#bg)"/>

  <!-- Decorative Circles -->

  <circle cx="180" cy="100" r="70" fill="#5D688A" opacity="0.08"/>
  <circle cx="1220" cy="90" r="90" fill="#F7A5A5" opacity="0.08"/>
  <circle cx="1180" cy="450" r="80" fill="#FFDBB6" opacity="0.06"/>

  <!-- Outer Container -->

  <rect
    x="50"
    y="30"
    width="1300"
    height="425"
    rx="28"
    fill="url(#cardFill)"
    stroke="url(#accent)"
    stroke-opacity="0.45"
    stroke-width="1.5"/>

  <!-- Publication Card 1 -->

  <g class="fadeIn d1">

    <rect
      x="90"
      y="50"
      width="1220"
      height="170"
      rx="22"
      fill="#0E1525"
      stroke="#5D688A"
      stroke-opacity="0.55"
      stroke-width="1.2"/>

    <rect
      x="90"
      y="50"
      width="1220"
      height="8"
      rx="4"
      fill="url(#accent)"
      opacity="0.85"/>

    <text
      x="120"
      y="100"
      class="cardTitle"
      fill="#FFF2EF">
      🧠 Hybrid Quantum–Classical Multi-Scale Graph Learning
    </text>

    <text
      x="120"
      y="140"
      class="body"
      fill="#FFF2EF"
      opacity="0.92">
      Developing a hybrid AI pipeline combining GATs, 3D-CNNs and Variational Quantum Circuits for glioblastoma detection using hyperspectral images
    </text>

    <!-- Tags -->

    <g transform="translate(120,170)">

      <rect x="0" y="0" rx="12" width="95" height="28" fill="#5D688A"/>
      <rect x="105" y="0" rx="12" width="78" height="28" fill="#F7A5A5"/>
      <rect x="193" y="0" rx="12" width="70" height="28" fill="#FFDBB6"/>
      <rect x="273" y="0" rx="12" width="105" height="28" fill="#5D688A"/>

      <text x="48" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        PennyLane
      </text>

      <text x="144" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        PyTorch
      </text>

      <text x="228" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        GNNs
      </text>

      <text x="325" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        Quantum ML
      </text>

    </g>

  </g>

  <!-- Publication Card 2 -->

  <g class="fadeIn d2">

    <rect
      x="90"
      y="250"
      width="1220"
      height="170"
      rx="22"
      fill="#0E1525"
      stroke="#F7A5A5"
      stroke-opacity="0.55"
      stroke-width="1.2"/>

    <rect
      x="90"
      y="250"
      width="1220"
      height="8"
      rx="4"
      fill="url(#accent)"
      opacity="0.85"/>

    <text
      x="120"
      y="300"
      class="cardTitle"
      fill="#FFF2EF">
      ⚡ EV Charging Demand Forecasting (IEEE IoT-SIU 2025)
    </text>

    <text
      x="120"
      y="340"
      class="body"
      fill="#FFF2EF"
      opacity="0.92">
      Co-authored an IEEE publication using 250K+ EV charging sessions to forecast long-term charging demand and infrastructure requirements through 2035.
    </text>

    <!-- Tags -->

    <g transform="translate(120,370)">

      <rect x="0" y="0" rx="12" width="58" height="28" fill="#5D688A"/>
      <rect x="68" y="0" rx="12" width="110" height="28" fill="#F7A5A5"/>
      <rect x="188" y="0" rx="12" width="58" height="28" fill="#FFDBB6"/>
      <rect x="256" y="0" rx="12" width="105" height="28" fill="#5D688A"/>

      <text x="29" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        ML
      </text>

      <text x="123" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        Forecasting
      </text>

      <text x="217" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        IEEE
      </text>

      <text x="309" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        Analytics
      </text>

    </g>

  </g>

</svg>
