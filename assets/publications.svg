<svg width="100%" height="100%" viewBox="0 0 1400 780" fill="none"
xmlns="http://www.w3.org/2000/svg"
shape-rendering="geometricPrecision"
text-rendering="geometricPrecision">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520">
<stop offset="0%" stop-color="#0B1020"/>
<stop offset="100%" stop-color="#11192B"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1400" y2="520">
<stop offset="0%" stop-color="#5D688A"/>
<stop offset="50%" stop-color="#F7A5A5"/>
<stop offset="100%" stop-color="#FFDBB6"/>
</linearGradient>
<linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#121A2B"/>
<stop offset="100%" stop-color="#0C1220"/>
</linearGradient>
<style>
      .title {
        font: 800 34px Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .cardTitle {
        font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .body {
        font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .pill {
        font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .fadeIn {
        opacity: 0;
        animation: fadeInUp 0.8s ease forwards;
      }
      .d1 { animation-delay: 0.15s; }
      .d2 { animation-delay: 0.35s; }
      .d3 { animation-delay: 0.55s; }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
</style>
</defs>
<!-- Background -->
<rect width="1400" height="780" fill="url(#bg)"/>
<!-- Decorative Circles -->
<circle cx="180" cy="100" r="70" fill="#5D688A" opacity="0.08"/>
<circle cx="1220" cy="90" r="90" fill="#F7A5A5" opacity="0.08"/>
<circle cx="1180" cy="450" r="80" fill="#FFDBB6" opacity="0.06"/>
<!-- Outer Container -->
<rect
x="50"
y="30"
width="1300"
height="650"
rx="28"
fill="url(#cardFill)"
stroke="url(#accent)"
stroke-opacity="0.45"
stroke-width="1.5"/>
<!-- Publication Card 1 -->
<g class="fadeIn d1">
<rect
x="90"
y="50"
width="1220"
height="170"
rx="22"
fill="#0E1525"
stroke="#5D688A"
stroke-opacity="0.55"
stroke-width="1.2"/>
<rect
x="90"
y="50"
width="1220"
height="8"
rx="4"
fill="url(#accent)"
opacity="0.85"/>
<text
x="120"
y="100"
class="cardTitle"
fill="#FFF2EF">
      🔋 EV Charging Demand Forecasting
</text>
<text
x="120"
y="140"
class="body"
fill="#FFF2EF"
opacity="0.92">
      IEEE conference paper forecasting EV charging demand from 250K+ real-world charging sessions. Benchmarked regression models, achieving 0.37% relative forecasting error.
</text>
<!-- Tags -->
<g transform="translate(120,170)">
<rect x="0" y="0" rx="12" width="68" height="28" fill="#5D688A"/>
<rect x="78" y="0" rx="12" width="155" height="28" fill="#F7A5A5"/>
<rect x="243" y="0" rx="12" width="82" height="28" fill="#FFDBB6"/>
<text x="34" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        IEEE
</text>
<text x="155.5" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        Machine Learning
</text>
<text x="284" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        Python
</text>
</g>
</g>
<!-- Publication Card 2 -->
<g class="fadeIn d2">
<rect
x="90"
y="240"
width="1220"
height="170"
rx="22"
fill="#0E1525"
stroke="#F7A5A5"
stroke-opacity="0.55"
stroke-width="1.2"/>
<rect
x="90"
y="240"
width="1220"
height="8"
rx="4"
fill="url(#accent)"
opacity="0.85"/>
<text
x="120"
y="290"
class="cardTitle"
fill="#FFF2EF">
      ⚛️ Quantum-Inspired Routing Optimization in Communication Networks
</text>
<text
x="120"
y="330"
class="body"
fill="#FFF2EF"
opacity="0.92">
      MATLAB simulation formulating network routing as QUBO-inspired multi-objective optimization minimizing latency, energy &amp; emissions on 40-node topology.
</text>
<!-- Tags -->
<g transform="translate(120,360)">
<rect x="0" y="0" rx="12" width="88" height="28" fill="#5D688A"/>
<rect x="98" y="0" rx="12" width="82" height="28" fill="#F7A5A5"/>
<rect x="190" y="0" rx="12" width="115" height="28" fill="#FFDBB6"/>
<text x="44" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        MATLAB
</text>
<text x="139" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        Quantum
</text>
<text x="247.5" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        Optimization
</text>
</g>
</g>
<!-- Publication Card 3 -->
<g class="fadeIn d3">
<rect
x="90"
y="430"
width="1220"
height="170"
rx="22"
fill="#0E1525"
stroke="#FFDBB6"
stroke-opacity="0.55"
stroke-width="1.2"/>
<rect
x="90"
y="430"
width="1220"
height="8"
rx="4"
fill="url(#accent)"
opacity="0.85"/>
<text
x="120"
y="480"
class="cardTitle"
fill="#FFF2EF">
      🧬 Hybrid Quantum–Classical Multi-Scale Graph Learning for Glioblastoma Detection
</text>
<text
x="120"
y="520"
class="body"
fill="#FFF2EF"
opacity="0.92">
      Initial pipeline with 3D-CNN, Graph Attention Networks &amp; Variational Quantum Circuits on hyperspectral histological images using PCA reduction.
</text>
<!-- Tags -->
<g transform="translate(120,550)">
<rect x="0" y="0" rx="12" width="115" height="28" fill="#5D688A"/>
<rect x="125" y="0" rx="12" width="88" height="28" fill="#F7A5A5"/>
<rect x="223" y="0" rx="12" width="175" height="28" fill="#FFDBB6"/>
<text x="57.5" y="19" text-anchor="middle" class="pill" fill="#FFF2EF">
        Quantum ML
</text>
<text x="169" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        3D-CNN
</text>
<text x="310.5" y="19" text-anchor="middle" class="pill" fill="#0B1020">
        Hyperspectral Imaging
</text>
</g>
</g>
</svg>
